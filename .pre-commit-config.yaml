default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^(pyecospold/schemas|tests/fixtures|docs/_static)/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-illegal-windows-names
  - id: check-merge-conflict
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.0
  hooks:
  - id: commitizen
  - id: commitizen-branch

- repo: https://github.com/crate-ci/typos
  rev: v1.50.3
  hooks:
  - id: typos

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: v0.2.77
  hooks:
  - id: rumdl-check
    args: [--fix]

- repo: https://github.com/lycheeverse/lychee
  rev: lychee-v0.24.2
  hooks:
  - id: lychee
    stages: [manual] # needs the network; CI runs it
    exclude: ^(uv\.lock|\.pre-commit-config\.yaml)$ # package URLs; lychee's own patterns
    args:
    - --no-progress
    - --exclude # XML namespace URIs and verbatim fixture text
    - (?i)^https?://(www\.)?ecoinvent\.org/
    - --exclude # files that reach main only when the PR merges
    - ^https://github\.com/brightway-lca/pyecospold/(blob/main|actions)/

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.2
  hooks:
  - id: check-readthedocs
  - id: check-dependabot

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.19
  hooks:
  - id: uv-lock
  - id: uv-audit

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: v2.29.4
  hooks:
  - id: pyproject-fmt

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.9
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
    types_or: [python, pyi, jupyter, markdown] # also Python blocks in Markdown

- repo: local
  hooks:
  - id: pyrefly
    name: pyrefly
    entry: uv run --frozen pyrefly check
    language: system
    types: [python]
    pass_filenames: false
  - id: deptry
    name: deptry
    entry: uv run --frozen deptry .
    language: system
    files: (\.py|pyproject\.toml)$
    pass_filenames: false
  - id: pytest
    name: pytest
    entry: uv run --frozen pytest
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-push]
