default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^(pyecospold/schemas|tests/fixtures|docs/_static)/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-illegal-windows-names
  - id: check-json
  - id: check-merge-conflict
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.19
  hooks:
  - id: uv-lock
  - id: uv-audit

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.9
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: pyrefly
    name: pyrefly
    entry: uv run --frozen pyrefly check
    language: system
    types: [python]
    pass_filenames: false
  - id: deptry
    name: deptry
    entry: uv run --frozen deptry .
    language: system
    files: (\.py|pyproject\.toml)$
    pass_filenames: false
  - id: pytest
    name: pytest
    entry: uv run --frozen pytest
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-push]
