default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^(pyecospold/schemas|tests/fixtures|docs/_static)/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-illegal-windows-names
  - id: check-merge-conflict
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace

- repo: https://github.com/gitleaks/gitleaks
  rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
  hooks:
  - id: gitleaks

- repo: https://github.com/commitizen-tools/commitizen
  rev: 3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce  # frozen: v4.19.0
  hooks:
  - id: commitizen
  - id: commitizen-branch

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 59e7b26529dc6f15c43063064b8b06ded60d0910  # frozen: v2.29.4
  hooks:
  - id: pyproject-fmt

- repo: https://github.com/crate-ci/typos
  rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
  hooks:
  - id: typos

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: cbd02203fbbb2839cd7e25e3062628ba4af18991  # frozen: v0.2.77
  hooks:
  - id: rumdl-check
    args: [--fix]

- repo: https://github.com/lycheeverse/lychee
  rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b  # frozen: lychee-v0.24.2
  hooks:
  - id: lychee
    stages: [manual] # needs the network; CI runs it
    exclude: ^(uv\.lock|\.pre-commit-config\.yaml)$ # package URLs; lychee's own patterns
    args:
    - --no-progress
    - --exclude # XML namespace URIs and verbatim fixture text
    - (?i)^https?://(www\.)?ecoinvent\.org/
    - --exclude # files that reach main only when the PR merges
    - ^https://github\.com/brightway-lca/pyecospold/(blob/main|actions)/

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
  hooks:
  - id: check-readthedocs
  - id: check-renovate

- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor

- repo: https://github.com/jsh9/pydoclint
  rev: e0aeee36ac994cefd38eefca3d073fcb2154bc76  # frozen: 0.10.1
  hooks:
  - id: pydoclint

- repo: https://github.com/abravalheri/validate-pyproject
  rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # frozen: 0.26
  hooks:
  - id: validate-pyproject
    additional_dependencies: ["validate-pyproject-schema-store[all]==2026.9.25"]

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 2aeb804518b4373dbf5adb8dddc5466d9a6e6b21  # frozen: 0.12.19
  hooks:
  - id: uv-lock
  - id: uv-audit
    # what users install; the dev and docs tools' fixes need Python >=3.10
    args: [--no-dev, --no-group, test, --no-group, docs]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
    types_or: [python, pyi, jupyter, markdown]

- repo: local
  hooks:
  - id: pyrefly
    name: pyrefly
    entry: uv run --frozen pyrefly check
    language: system
    types: [python]
    pass_filenames: false
  - id: deptry
    name: deptry
    entry: uv run --frozen deptry .
    language: system
    files: (\.py|pyproject\.toml)$
    pass_filenames: false
  - id: pytest
    name: pytest
    entry: uv run --frozen pytest
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-push]
