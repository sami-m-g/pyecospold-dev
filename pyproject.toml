[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.19,<0.13" ]

[project]
name = "pyecospold"
version = "4.0.1"
description = """\
  A Python package that converts ecospold XML formats to their Python equivalents and export the same data back to XML.\
  """
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Mina Sami", email = "sami.mg@outlook.com" },
  { name = "Chris Mutel", email = "cmutel@gmail.com" }
]
authors = [ { name = "Mina Sami", email = "sami.mg@outlook.com" } ]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=4.8",
  "python-dateutil>=2.7",
  "typing-extensions>=4.4",
]
urls.homepage = "https://github.com/brightway-lca/pyecospold"
urls.source = "https://github.com/brightway-lca/pyecospold"
urls.tracker = "https://github.com/brightway-lca/pyecospold/issues"

[dependency-groups]
dev = [
  { include-group = "test" },
  "deptry",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "types-lxml-multi-subclass>=2026.2.16",
  "types-python-dateutil>=2.9.0.20260124",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-randomly>=3.15",
]
docs = [
  "sphinx==7.1.2",
  "sphinx-rtd-theme==1.3.0rc1",
]

[tool.uv]
required-version = ">=0.12.19"
build-backend.module-root = ""

[tool.ruff]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # licence is declared once in pyproject
  "FA100",  # X | Y needs Python 3.10; keep Union/Optional while 3.9 is supported
  "FBT001", # temporary: making save options keyword-only changes public signatures
  "FBT002", # temporary: making save options keyword-only changes public signatures
  "PLR09",  # complexity thresholds are arbitrary
  "TC003",  # stdlib imports cost nothing at runtime; keep annotations resolvable
  "TRY004", # temporary: raising TypeError in the date setters changes behavior
  "UP007",  # X | Y needs Python 3.10; keep Union/Optional while 3.9 is supported
]
lint.per-file-ignores."docs/conf.py" = [ "A001", "INP001" ]  # Sphinx requires `copyright`; not a package
lint.per-file-ignores."pyecospold/model_v*.py" = [
  "D205", # docstrings are copied 1:1 from the XSD
  "N802", # public API names mirror the XSD
  "N815",
]
lint.per-file-ignores."tests/**" = [
  "ANN",
  "D",
  "DTZ001",  # fixtures hold naive timestamps, which the models return as-is
  "PLR2004",
  "S101",
]
lint.allowed-confusables = [ "–", "‘", "σ" ]  # verbatim text from the XSD and fixtures
lint.pydocstyle.convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = false
exclude = 'model_v[12]\.py|tests'  # model docstrings are copied from the XSD

[tool.pyproject-fmt]
max_supported_python = "3.14"  # matches the CI matrix; Python version classifiers are generated

[tool.typos]
# verbatim text from the fixtures
default.extend-words.formate = "formate"  # methyl formate
default.extend-words.offen = "offen"
default.extend-words.situtation = "situtation"
# returned by Source.sourceTypeStr; correcting it changes behavior
default.extend-ignore-re = [ '"Seperate publication"' ]

[tool.pyrefly]
python-version = "3.9"
project-includes = [ "pyecospold", "tests" ]
preset = "strict"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
# pytest 8 (Python 3.9) doesn't read the native [tool.pytest] table
ini_options.addopts = [
  "-ra",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "--cov",
  "--cov-report=term-missing",
]
ini_options.xfail_strict = true
ini_options.filterwarnings = [ "error" ]

[tool.coverage]
run.source = [ "pyecospold" ]
run.branch = true
report.fail_under = 99
report.skip_covered = true

[tool.rumdl]
MD013.line-length = 88  # same as ruff
MD013.code-blocks = false  # ruff formats the Python blocks
MD013.tables = false  # tables can't wrap
MD013.reflow = true  # --fix rewraps long prose lines
