[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "pyecospold"
version = "4.0.1"
authors = [
  { name="Mina Sami", email="sami.mg@outlook.com" }
]
maintainers = [
  { name="Mina Sami", email="sami.mg@outlook.com" },
  { name="Chris Mutel", email="cmutel@gmail.com" }
]
description = "A Python package that converts ecospold XML formats to their Python equivalents and export the same data back to XML."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "lxml",
    "numpy",
    "python-dateutil",
]

[project.urls]
source = "https://github.com/brightway-lca/pyecospold"
homepage = "https://github.com/brightway-lca/pyecospold"
tracker = "https://github.com/brightway-lca/pyecospold/issues"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx==7.1.2",
    "sphinx-rtd-theme==1.3.0rc1",
]
dev = [
    { include-group = "test" },
    "pre-commit",
    "pylint",
    "pytest-randomly",
]

[tool.uv]
required-version = ">=0.12.19"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--cov pyecospold --cov-report term-missing --verbose"
norecursedirs = [
    "dist",
    "build",
    ".tox"
]
testpaths = ["tests/*.py"]

[tool.flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = ["E203", "W503"]
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude = [
    ".tox",
    "build",
    "dist",
    ".eggs",
    "docs/conf.py",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
