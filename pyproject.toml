[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "pyecospold"
version = "4.0.1"
authors = [
  { name="Mina Sami", email="sami.mg@outlook.com" }
]
maintainers = [
  { name="Mina Sami", email="sami.mg@outlook.com" },
  { name="Chris Mutel", email="cmutel@gmail.com" }
]
description = "A Python package that converts ecospold XML formats to their Python equivalents and export the same data back to XML."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.8",
    "python-dateutil>=2.7",
]

[project.urls]
source = "https://github.com/brightway-lca/pyecospold"
homepage = "https://github.com/brightway-lca/pyecospold"
tracker = "https://github.com/brightway-lca/pyecospold/issues"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "sphinx==7.1.2",
    "sphinx-rtd-theme==1.3.0rc1",
]
dev = [
    { include-group = "test" },
    "pre-commit>=4",
    "pytest-randomly>=3.15",
]

[tool.uv]
required-version = ">=0.12.19"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--cov pyecospold --cov-report term-missing --verbose"
norecursedirs = [
    "dist",
    "build",
    ".tox"
]
testpaths = ["tests/*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # licence is declared once in pyproject
    # temporary: existing violations; each is removed by the commit that fixes it
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN401",
    "ARG002",
    "ARG005",
    "B905",
    "C417",
    "DTZ001",
    "DTZ011",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "FURB171",
    "ISC004",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLW0108",
    "RUF001",
    "RUF002",
    "RUF012",
    "RUF013",
    "RUF036",
    "SIM117",
    "SLF001",
    "TC003",
    "TRY003",
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["A001", "INP001"] # Sphinx requires `copyright`; not a package
"pyecospold/model_v*.py" = [
    "D205", # docstrings are copied 1:1 from the XSD
    "N802", # public API names mirror the XSD
    "N815",
]
"tests/**" = ["ANN", "D", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
