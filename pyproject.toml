[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.19,<0.13" ]

[project]
name = "pyecospold"
version = "4.0.1"
description = """\
  A Python package that converts ecospold XML formats to their Python equivalents and export the same data back to XML.\
  """
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Mina Sami", email = "sami.mg@outlook.com" },
  { name = "Chris Mutel", email = "cmutel@gmail.com" }
]
authors = [ { name = "Mina Sami", email = "sami.mg@outlook.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "lxml>=4.8",
  "python-dateutil>=2.7",
  "typing-extensions>=4.4",
]
urls.homepage = "https://github.com/brightway-lca/pyecospold"
urls.source = "https://github.com/brightway-lca/pyecospold"
urls.tracker = "https://github.com/brightway-lca/pyecospold/issues"

[dependency-groups]
dev = [
  { include-group = "test" },
  "deptry>=0.25.1",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "types-lxml-multi-subclass>=2026.2.16",
  "types-python-dateutil>=2.9.0.20260807",
]
test = [
  "pytest>=9",
  "pytest-cov>=5",
  "pytest-randomly>=3.15",
]
docs = [
  "sphinx==7.1.2",
  "sphinx-rtd-theme==1.3.0rc1",
]

[tool.uv]
required-version = ">=0.12.19"
build-backend.module-root = ""

[tool.ruff]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # licence is declared once in pyproject
  "PLR09",  # complexity thresholds are arbitrary
]
lint.per-file-ignores."docs/conf.py" = [ "A001", "INP001" ]  # Sphinx requires `copyright`; not a package
lint.per-file-ignores."pyecospold/core.py" = [ "ARG002" ]  # lookup() overrides lxml's fixed signature
lint.per-file-ignores."pyecospold/model_v*.py" = [
  "D205", # docstrings are copied 1:1 from the XSD
  "N802", # public API names mirror the XSD
  "N815",
]
lint.per-file-ignores."pyecospold/{helpers,lxmlh/*}.py" = [
  "ANN401", # values and element classes are resolved at runtime
]
lint.per-file-ignores."tests/**" = [
  "ANN",
  "D",
  "DTZ001",  # fixtures hold naive timestamps, which the models return as-is
  "INP001",
  "PLR2004",
  "S101",
]
lint.allowed-confusables = [ "–", "‘", "σ" ]  # verbatim text from the XSD and fixtures
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.14"  # matches the CI matrix; Python version classifiers are generated

[tool.typos]
# verbatim text from the fixtures
default.extend-words.formate = "formate"
default.extend-words.offen = "offen"
default.extend-words.situtation = "situtation"
# model docstrings are copied 1:1 from the XSD
type.xsd-docs.extend-glob = [ "model_v*.py" ]
type.xsd-docs.extend-words = { additonal = "additonal", exhange = "exhange", exhanges = "exhanges", independant = "independant", occurences = "occurences", overriden = "overriden", refering = "refering", seperate = "seperate", varible = "varible" }

[tool.pyrefly]
project-includes = [ "pyecospold", "tests" ]
preset = "strict"

[tool.pytest]
addopts = [ "-ra", "--import-mode=importlib", "--cov", "--cov-report=term-missing" ]
filterwarnings = [ "error" ]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "pyecospold" ]
run.branch = true
report.fail_under = 99
report.skip_covered = true
